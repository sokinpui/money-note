name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Compress iOS build
        run: |
          cd build/ios/iphoneos
          zip -r Runner.zip Runner.app
      - name: Upload iOS App
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: build/ios/iphoneos/Runner.zip

  create-release:
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: ios-release
          path: artifacts/
      - name: Rename artifacts
        run: |
          mv artifacts/app-release.apk artifacts/money-note-android.apk
          mv artifacts/Runner.zip artifacts/money-note-ios.zip
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/money-note-android.apk
            artifacts/money-note-ios.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
